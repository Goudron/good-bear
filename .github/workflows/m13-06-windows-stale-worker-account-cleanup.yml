name: M13 Windows stale worker account cleanup

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: [self-hosted, Windows, X64, goodbear]
    timeout-minutes: 5
    steps:
      - name: Remove only the marked disabled stale worker account
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not ('GoodBearStaleUser' -as [type])) {
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class GoodBearStaleUser {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)]
            public struct UserInfo1 { public string Name; public string Password; public int PasswordAge; public int Privilege; public string HomeDirectory; public string Comment; public int Flags; public string ScriptPath; }
            [DllImport("Netapi32.dll", CharSet=CharSet.Unicode)] public static extern int NetUserGetInfo(string servername, string username, int level, out IntPtr buffer);
            [DllImport("Netapi32.dll")] public static extern int NetApiBufferFree(IntPtr buffer);
          }
'@
          }
          $name = 'gbbuild'
          [IntPtr]$buffer = [IntPtr]::Zero
          $status = [GoodBearStaleUser]::NetUserGetInfo($env:COMPUTERNAME, $name, 1, [ref]$buffer)
          if ($status -eq 2221) { Write-Output 'NO_STALE_WORKER_ACCOUNT'; exit 0 }
          if ($status -ne 0) { throw 'Native local user lookup failed' }
          try {
            $info = [Runtime.InteropServices.Marshal]::PtrToStructure($buffer, [type][GoodBearStaleUser+UserInfo1])
            if ($info.Comment -cnotmatch '^GBN:[0-9a-f]{32}$' -or (($info.Flags -band 2) -eq 0)) { throw 'Account is not an owned disabled M13 worker' }
          } finally { if ($buffer -ne [IntPtr]::Zero) { [void][GoodBearStaleUser]::NetApiBufferFree($buffer) } }
          & net.exe user $name /delete | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Stale worker account removal failed' }
          Write-Output 'STALE_M13_WORKER_ACCOUNT_REMOVED'
