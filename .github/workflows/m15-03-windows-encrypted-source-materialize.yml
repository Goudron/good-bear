name: M15-03 Windows encrypted source materialization

on:
  workflow_dispatch:

permissions: {}

jobs:
  materialize:
    runs-on: [self-hosted, Windows, X64, goodbear]
    # A first native NTFS copy of Firefox takes tens of minutes.  This leaves
    # room for secure recovery and verification without treating it as failed.
    timeout-minutes: 150
    env:
      GOODBEAR_M15_03_SOURCE_PASSPHRASE_B64: ${{ secrets.GOODBEAR_M15_03_SOURCE_PASSPHRASE_B64 }}
      GOODBEAR_M15_03_PKI_PASSPHRASE_B64: ${{ secrets.GOODBEAR_M15_03_PKI_PASSPHRASE_B64 }}
      GOODBEAR_WORKSPACE: C:\GoodBear\m15-03-private-source
      GOODBEAR_CACHE: C:\GoodBear\m15-03-encrypted-cache
      GOODBEAR_ASSET_URL: https://github.com/Goudron/good-bear/releases/download/m15-10-windows-source-encrypted-r27-20260925/source-bundle.tar.enc
      GOODBEAR_EXPECTED_CIPHER: 3b8a3cc88fff0f4e672cec316002ea47375e5a0e7aa5884d1ba51836b55fe106
      GOODBEAR_EXPECTED_BUNDLE: 155838efa959b8ef4c6570aaa57bd7383daa1c382ecc94a3df46007c25ae3710
      GOODBEAR_EXPECTED_MANIFEST: 8046ffb8ae11b312ded8803cad7c5a5672e067bf533f2442d7b25665bf2e1e75
      GOODBEAR_EXPECTED_FIREFOX_VERSION: 156.0
      GOODBEAR_EXPECTED_FIREFOX_REVISION: 3bf8f468258c2181f455e23d4ffcd6acb8f4cdb1
      GOODBEAR_EXPECTED_FIREFOX_SHA256: 1f2768c043510009abaa3f078123664e106d3ab9dfce75d1819ad96b2145aab9
      GOODBEAR_PKI_ASSET_URL: https://github.com/Goudron/good-bear/releases/download/m15-10-windows-pki-transport-r27-20260925/pki-input-transport.tar.enc
      GOODBEAR_EXPECTED_PKI_CIPHER: 174bc464c34c6b0996f0e41ca28c838ced8ccc4f88a66d20327ac03cd0f62513
      GOODBEAR_EXPECTED_PKI_TRANSPORT: 7bb33ebb1dbf725f8b5da1cfee9f894685ad035e956d7cc074691970d845d13c
      GOODBEAR_PYTHON: C:\GoodBear\tools\Python312\python.exe
      GOODBEAR_OPENSSL: C:\mozilla-build\msys2\usr\bin\openssl.exe
    steps:
      - name: Prepare confidential workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GOODBEAR_WORKSPACE
          $cache = $env:GOODBEAR_CACHE
          Remove-Item -LiteralPath 'C:\GoodBear\m15-03-materialization-evidence.json' -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $workspace) {
            Write-Output 'Removing interrupted private workspace'
            try {
              Remove-Item -LiteralPath $workspace -Recurse -Force -ErrorAction Stop
            }
            catch {
              # Only repair ACLs when direct deletion proves that it is needed.
              Write-Output 'Direct removal was blocked; repairing workspace ACLs'
              & icacls $workspace /reset /T /C | Out-Null
              Remove-Item -LiteralPath $workspace -Recurse -Force -ErrorAction Stop
            }
          }
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          $workerGroup = 'GoodBear-Offline-Workers'
          & cmd.exe /d /c 'net localgroup GoodBear-Offline-Workers >nul 2>nul'
          if ($LASTEXITCODE -ne 0) {
            & cmd.exe /d /c 'net localgroup GoodBear-Offline-Workers /add >nul 2>nul'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create the offline-worker group' }
          }
          & cmd.exe /d /c 'net localgroup GoodBear-Offline-Workers >nul 2>nul'
          if ($LASTEXITCODE -ne 0) { throw 'Offline-worker group presence is unproven' }
          try {
            $workerSid = ([Security.Principal.NTAccount]::new($env:COMPUTERNAME, $workerGroup)).Translate([Security.Principal.SecurityIdentifier]).Value
          } catch { throw 'Cannot resolve the offline-worker group SID' }
          & icacls.exe $workspace /grant ('*' + $workerSid + ':(OI)(CI)RX') /deny ('*' + $workerSid + ':(OI)(CI)(WD,AD,WEA,WA,DE,DC,WDAC,WO)') /Q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot seed offline-worker inherited source ACL' }
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          Write-Output 'PRIVATE_WORKSPACE_READY'

      - name: Download and verify encrypted source cache
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-VerifiedCipher([string]$uri, [string]$destination, [string]$expected, [string]$label) {
            if (Test-Path -LiteralPath $destination) {
              $existing = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($existing -eq $expected) {
                Write-Output ("Using verified local " + $label + " cache")
                return
              }
            }
            $candidate = $destination + '.download'
            Remove-Item -LiteralPath $candidate -Force -ErrorAction SilentlyContinue
            Write-Output ("Downloading " + $label + " asset with bounded retries")
            & "$env:WINDIR\System32\curl.exe" --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 3600 --output $candidate $uri
            if ($LASTEXITCODE -ne 0) { throw ("Download failed for " + $label) }
            $candidateHash = (Get-FileHash -LiteralPath $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($candidateHash -ne $expected) { throw ("Downloaded " + $label + " SHA-256 does not match") }
            Move-Item -LiteralPath $candidate -Destination $destination -Force
          }
          $cipher = Join-Path $env:GOODBEAR_CACHE 'source-bundle.tar.enc'
          Get-VerifiedCipher $env:GOODBEAR_ASSET_URL $cipher $env:GOODBEAR_EXPECTED_CIPHER 'encrypted source'
          $cipherHash = (Get-FileHash -LiteralPath $cipher -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($cipherHash -ne $env:GOODBEAR_EXPECTED_CIPHER) { throw 'Encrypted source asset SHA-256 does not match' }
          $pkiCipher = Join-Path $env:GOODBEAR_CACHE 'pki-input-transport.tar.enc'
          Get-VerifiedCipher $env:GOODBEAR_PKI_ASSET_URL $pkiCipher $env:GOODBEAR_EXPECTED_PKI_CIPHER 'encrypted PKI transport'
          $pkiCipherHash = (Get-FileHash -LiteralPath $pkiCipher -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($pkiCipherHash -ne $env:GOODBEAR_EXPECTED_PKI_CIPHER) { throw 'Encrypted PKI transport asset SHA-256 does not match' }
          Write-Output 'ENCRYPTED_SOURCE_CACHE_VERIFIED'

      - name: Decrypt and extract private source bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GOODBEAR_M15_03_SOURCE_PASSPHRASE_B64) -or [string]::IsNullOrWhiteSpace($env:GOODBEAR_M15_03_PKI_PASSPHRASE_B64)) { throw 'An encrypted transport Actions secret is absent' }
          $workspace = $env:GOODBEAR_WORKSPACE
          $cipher = Join-Path $env:GOODBEAR_CACHE 'source-bundle.tar.enc'
          $pkiCipher = Join-Path $env:GOODBEAR_CACHE 'pki-input-transport.tar.enc'
          $bundle = Join-Path $workspace 'source-bundle.tar'
          $pkiTransport = Join-Path $workspace 'pki-input-transport.tar'
          $keyFile = Join-Path $workspace '.source-passphrase'
          $pkiKeyFile = Join-Path $workspace '.pki-passphrase'
          try {
            [IO.File]::WriteAllBytes($keyFile, [Convert]::FromBase64String($env:GOODBEAR_M15_03_SOURCE_PASSPHRASE_B64))
            [IO.File]::WriteAllBytes($pkiKeyFile, [Convert]::FromBase64String($env:GOODBEAR_M15_03_PKI_PASSPHRASE_B64))
            & $env:GOODBEAR_OPENSSL enc -d -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha512 -pass "file:$keyFile" -in $cipher -out $bundle
            if ($LASTEXITCODE -ne 0) { throw 'Encrypted source decryption failed' }
            & $env:GOODBEAR_OPENSSL enc -d -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha512 -pass "file:$pkiKeyFile" -in $pkiCipher -out $pkiTransport
            if ($LASTEXITCODE -ne 0) { throw 'Encrypted PKI transport decryption failed' }
          }
          finally {
            if (Test-Path -LiteralPath $keyFile) { Remove-Item -LiteralPath $keyFile -Force }
            if (Test-Path -LiteralPath $pkiKeyFile) { Remove-Item -LiteralPath $pkiKeyFile -Force }
          }
          $bundleHash = (Get-FileHash -LiteralPath $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bundleHash -ne $env:GOODBEAR_EXPECTED_BUNDLE) { throw 'Decrypted source bundle SHA-256 does not match' }
          $pkiTransportHash = (Get-FileHash -LiteralPath $pkiTransport -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($pkiTransportHash -ne $env:GOODBEAR_EXPECTED_PKI_TRANSPORT) { throw 'Decrypted PKI transport SHA-256 does not match' }
          & "$env:WINDIR\System32\tar.exe" -xf $bundle -C $workspace
          if ($LASTEXITCODE -ne 0) { throw 'Source bundle extraction failed' }
          & "$env:WINDIR\System32\tar.exe" -xf $pkiTransport -C $workspace
          if ($LASTEXITCODE -ne 0) { throw 'PKI transport extraction failed' }
          Write-Output 'PRIVATE_SOURCE_BUNDLE_EXTRACTED_AND_VERIFIED'

      - name: Verify private source bundle manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GOODBEAR_WORKSPACE
          $verifier = Join-Path $workspace 'source\tools\m15_remote_transport.py'
          $manifest = Join-Path $workspace 'source-manifest.json'
          $bundle = Join-Path $workspace 'source-bundle.tar'
          $pythonCache = Join-Path $workspace 'python-startup'
          New-Item -ItemType Directory -Path $pythonCache -Force | Out-Null
          $trustedWrapper = @'
import pathlib, runpy, sys
entry = sys.argv.pop(1)
sys.path.insert(0, str(pathlib.Path(entry).parent))
sys.argv[0] = entry
runpy.run_path(entry, run_name="__main__")
          '@
          $env:PATH = (Split-Path -Parent $env:GOODBEAR_OPENSSL) + ';' + $env:PATH
          & $env:GOODBEAR_PYTHON -I -S -B -u -X ('pycache_prefix=' + $pythonCache) -c $trustedWrapper $verifier verify-bundle --destination $workspace --root (Join-Path $workspace 'source') --manifest $manifest --bundle $bundle --expected-manifest-sha256 $env:GOODBEAR_EXPECTED_MANIFEST --expected-bundle-sha256 $env:GOODBEAR_EXPECTED_BUNDLE
          if ($LASTEXITCODE -ne 0) { throw 'M15-03 source bundle verification failed' }
          $pkiInstall = Join-Path $workspace 'source\artifacts\certificates\build-inputs\current'
          & $env:GOODBEAR_PYTHON -I -S -B -u -X ('pycache_prefix=' + $pythonCache) -c $trustedWrapper $verifier stage-pki --destination $workspace --root (Join-Path $workspace 'source') --source-manifest $manifest --source-bundle $bundle --install-pki-dir $pkiInstall
          if ($LASTEXITCODE -ne 0) { throw 'M15-03 PKI transport verification failed' }
          Write-Output 'PRIVATE_SOURCE_MANIFEST_VERIFIED'

      - name: Materialize isolated Firefox worktree
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GOODBEAR_WORKSPACE
          $materializer = Join-Path $workspace 'source\tools\materialize_firefox_source.py'
          $baseline = Join-Path $workspace 'source\config\firefox-baseline.json'
          $archive = Join-Path $workspace 'source\source\firefox-156.0.source.tar.xz'
          $pythonCache = Join-Path $workspace 'python-startup'
          $materializationGate = @'
import hashlib, importlib.util, json, sys
from pathlib import Path

def _sha(path, algorithm="sha256"):
    digest = hashlib.new(algorithm)
    with Path(path).open("rb") as source:
        for block in iter(lambda: source.read(1024 * 1024), b""):
            digest.update(block)
    return digest.hexdigest()

def checked_materialization(root, expected_version, expected_revision, expected_sha256, materializer):
    root = Path(root).resolve()
    baseline_path = root / "config/firefox-baseline.json"
    baseline = materializer.load_config(baseline_path)
    source = baseline.get("source", {})
    if baseline.get("version") != expected_version:
        raise ValueError("baseline is not the approved Firefox " + expected_version)
    if baseline.get("vcs", {}).get("revision") != expected_revision:
        raise ValueError("source revision differs from the approved Firefox pin")
    if source.get("sha256") != expected_sha256:
        raise ValueError("source archive pin differs from the approved Firefox pin")
    _, archive, _ = materializer.baseline_values(baseline, baseline_path)
    before = _sha(baseline_path)
    verifier = root / "tools/verify_firefox_baseline.py"
    worktree = materializer.materialize(baseline_path, archive, verifier, baseline_offline=True)
    expected_worktree = archive.parent / "worktrees" / materializer.archive_root_name(expected_version)
    if Path(worktree).resolve() != expected_worktree.resolve():
        raise ValueError("materializer returned a noncanonical baseline layout")
    marker_path = expected_worktree / ".good-bear-materialization.json"
    marker = json.loads(marker_path.read_text(encoding="utf-8"))
    if _sha(baseline_path) != before:
        raise ValueError("Baseline changed during materialization")
    expected_marker = {"version": expected_version, "baseline_config_sha256": before,
                       "source_sha256": expected_sha256, "source_sha512": source.get("sha512")}
    if any(marker.get(key) != value for key, value in expected_marker.items()):
        raise ValueError("materialization marker differs from the approved baseline")
    if not isinstance(marker.get("patches"), list) or not isinstance(marker.get("overlay_files"), list):
        raise ValueError("patch manifest differs from materialization provenance")
    expected_patches = []
    for raw in (root / "patches/series").read_text(encoding="utf-8").splitlines():
        name = raw.strip()
        if name and not name.startswith("#"):
            expected_patches.append({"path": name, "sha256": _sha(root / "patches" / name)})
    if marker["patches"] != expected_patches:
        raise ValueError("patch manifest differs from materialization provenance")
    overlay_root = root / "overlay"
    expected_overlay = sorted(
        path.relative_to(overlay_root).as_posix()
        for path in overlay_root.rglob("*")
        if path.is_file() and path.name != ".gitkeep"
    )
    if marker["overlay_files"] != expected_overlay:
        raise ValueError("overlay manifest differs from materialization provenance")
    version_file = expected_worktree / "browser/config/version.txt"
    if version_file.read_text(encoding="utf-8").strip() != expected_version:
        raise ValueError("Materialized source version differs from marker and baseline")
    return {"version": expected_version, "revision": expected_revision,
            "baseline_config_sha256": before, "materialization_marker_sha256": _sha(marker_path)}

if __name__ == "__main__":
    script, root, version, revision, source_sha256 = sys.argv[1:6]
    spec = importlib.util.spec_from_file_location("goodbear_materializer", script)
    module = importlib.util.module_from_spec(spec)
    spec.loader.exec_module(module)
    print(json.dumps(checked_materialization(root, version, revision, source_sha256, module), sort_keys=True))
          '@
          $env:PATH = 'C:\Program Files\Git\cmd;' + $env:PATH
          & $env:GOODBEAR_PYTHON -I -S -B -u -X ('pycache_prefix=' + $pythonCache) -c $materializationGate $materializer (Join-Path $workspace 'source') $env:GOODBEAR_EXPECTED_FIREFOX_VERSION $env:GOODBEAR_EXPECTED_FIREFOX_REVISION $env:GOODBEAR_EXPECTED_FIREFOX_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Good Bear source materialization failed' }
          $worktree = Join-Path $workspace 'source\source\worktrees\firefox-156.0'
          if (-not (Test-Path -LiteralPath (Join-Path $worktree '.good-bear-materialization.json'))) { throw 'Materialization provenance marker is absent' }
          $workerGroup = 'GoodBear-Offline-Workers'
          try {
            $workerSid = ([Security.Principal.NTAccount]::new($env:COMPUTERNAME, $workerGroup)).Translate([Security.Principal.SecurityIdentifier]).Value
          } catch { throw 'Cannot resolve the offline-worker group SID for materialized source ACL' }
          & icacls.exe $worktree /grant:r ('*' + $workerSid + ':(OI)(CI)RX') /deny ('*' + $workerSid + ':(OI)(CI)(WD,AD,WEA,WA,DE,DC,WDAC,WO)') /T /C /Q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot apply effective offline-worker read ACL to materialized worktree' }
          Write-Output 'PRIVATE_FIREFOX_WORKTREE_MATERIALIZED'

      - name: Publish source-free materialization evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = [ordered]@{
            task = 'GB100-M15-03'
            encrypted_asset_sha256 = $env:GOODBEAR_EXPECTED_CIPHER
            source_bundle_sha256 = $env:GOODBEAR_EXPECTED_BUNDLE
            source_manifest_sha256 = $env:GOODBEAR_EXPECTED_MANIFEST
            materialized = $true
            source_returned_as_artifact = $false
          }
          $evidence | ConvertTo-Json -Compress | Set-Content -LiteralPath 'C:\GoodBear\m15-03-materialization-evidence.json' -Encoding utf8
          Write-Output 'GOOD_BEAR_WINDOWS_ENCRYPTED_SOURCE_MATERIALIZED_OK'

      - name: Upload source-free materialization evidence
        uses: actions/upload-artifact@v4
        with:
          name: m15-03-windows-materialization-evidence
          path: C:\GoodBear\m15-03-materialization-evidence.json
          if-no-files-found: error
