name: M13 Windows native diagnostic

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: goodbear-windows-native-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: [self-hosted, Windows, X64, goodbear]
    timeout-minutes: 10
    steps:
      - name: Collect source-free native job and runner status
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = 'C:\GoodBear\m15-03-private-source'
          $jobsRoot = Join-Path $workspace 'native-offline-jobs'
          $operation = Join-Path 'C:\GoodBear\m15-03-operation-cache' ('diagnostic-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $operation -ErrorAction Stop | Out-Null
          try {
            $jobs = @()
            $job_entries = @()
            if (Test-Path -LiteralPath $jobsRoot) {
              foreach ($entry in Get-ChildItem -LiteralPath $jobsRoot -Force | Sort-Object Name) {
                $jobPath = Join-Path $entry.FullName 'job.json'
                $statePath = Join-Path $entry.FullName 'state.json'
                $job_entries += [ordered]@{
                  name = $entry.Name
                  is_directory = [bool]$entry.PSIsContainer
                  is_reparse_point = [bool]($entry.Attributes -band [IO.FileAttributes]::ReparsePoint)
                  has_job = [bool](Test-Path -LiteralPath $jobPath -PathType Leaf)
                  has_state = [bool](Test-Path -LiteralPath $statePath -PathType Leaf)
                  child_count = if ($entry.PSIsContainer) { @((Get-ChildItem -LiteralPath $entry.FullName -Force)).Count } else { $null }
                }
                if (-not $entry.PSIsContainer -or -not (Test-Path -LiteralPath $jobPath -PathType Leaf) -or -not (Test-Path -LiteralPath $statePath -PathType Leaf)) { continue }
                $job = Get-Content -LiteralPath $jobPath -Raw | ConvertFrom-Json
                $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
                $jobs += [ordered]@{
                  id = $entry.Name
                  phase = $job.phase
                  job_sha256 = (Get-FileHash -LiteralPath $jobPath -Algorithm SHA256).Hash.ToLowerInvariant()
                  status = $state.status
                  exit_code = $state.exit_code
                  network_restored = $state.network_restored
                  recovery_required = $state.recovery_required
                  last_error = $state.last_error
                  recovery_error = $state.recovery_error
                  updated_utc = $state.updated_utc
                }
              }
            }
            $runner = Get-CimInstance Win32_Service | Where-Object { $_.Name -like 'actions.runner.Goudron-good-bear.*' } | ForEach-Object {
              [ordered]@{ name=$_.Name; state=$_.State; start_mode=$_.StartMode; exit_code=$_.ExitCode; process_id=$_.ProcessId }
            }
            $adapters = Get-NetAdapter -IncludeHidden | ForEach-Object {
              [ordered]@{ name=$_.Name; status=$_.Status; if_index=$_.ifIndex; mac=$_.MacAddress }
            }
            [ordered]@{
              schema_version = 1
              kind = 'm13-windows-native-diagnostic'
              utc = (Get-Date).ToUniversalTime().ToString('o')
              native_jobs = $jobs
              native_job_entries = $job_entries
              runner_services = @($runner)
              adapters = @($adapters)
            } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $operation 'native-diagnostic.json') -Encoding utf8
            Write-Output ('NATIVE_DIAGNOSTIC_JOBS=' + $jobs.Count)
          }
          catch {
            throw ('Native diagnostic failed: ' + $_.Exception.Message)
          }

      - name: Return source-free diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned from the official action repository
        with:
          name: m13-windows-native-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: C:\GoodBear\m15-03-operation-cache\diagnostic-${{ github.run_id }}-${{ github.run_attempt }}\native-diagnostic.json
          if-no-files-found: error
          retention-days: 7
