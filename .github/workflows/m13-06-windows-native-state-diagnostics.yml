name: M13 Windows native state diagnostics

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Exact 32-hex native M13 job identifier
        required: true
        type: string

permissions: {}

jobs:
  state:
    runs-on: [self-hosted, Windows, X64, goodbear]
    timeout-minutes: 5
    steps:
      - name: Emit the allowlisted native state only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $jobId = '${{ inputs.job_id }}'
          if ($jobId -cnotmatch '^[0-9a-f]{32}$') { throw 'Exact 32-hex job ID is required' }
          $statePath = Join-Path 'C:\GoodBear\m15-03-private-source\native-offline-jobs' (Join-Path $jobId 'state.json')
          if (-not (Test-Path -LiteralPath $statePath)) { throw 'Native state is absent' }
          $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
          $jobPath = Join-Path 'C:\GoodBear\m15-03-private-source\native-offline-jobs' (Join-Path $jobId 'job.json')
          if (-not (Test-Path -LiteralPath $jobPath)) { throw 'Native job descriptor is absent' }
          $job = Get-Content -LiteralPath $jobPath -Raw | ConvertFrom-Json
          $allowed = @('status', 'exit_code', 'error', 'cleanup_error', 'recovery_error', 'last_error', 'network_transition_started', 'worker_started', 'network_restored', 'recovery_required', 'original_boot', 'recovered_boot')
          $record = [ordered]@{}
          foreach ($name in $allowed) {
            if ($state.PSObject.Properties.Name -contains $name) { $record[$name] = $state.$name }
          }
          # Emit only identifiers needed to diagnose native account/task ownership.
          $record['worker_account'] = [string]$job.worker_account
          $record['worker_task'] = [string]$job.worker_task
          & net.exe user $job.worker_account *> $null
          $record['worker_account_present'] = ($LASTEXITCODE -eq 0)
          & net.exe localgroup 'GoodBear-Offline-Workers' *> $null
          $record['worker_group_present'] = ($LASTEXITCODE -eq 0)
          $taskName = 'GoodBear-Offline-Recovery-' + $jobId
          $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if ($task) {
            $taskInfo = Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction Stop
            $record['recovery_task'] = [ordered]@{
              present = $true
              state = [string]$task.State
              last_task_result = [int]$taskInfo.LastTaskResult
              last_run_time = [string]$taskInfo.LastRunTime
              next_run_time = [string]$taskInfo.NextRunTime
            }
          } else {
            $record['recovery_task'] = [ordered]@{ present = $false }
          }
          $record | ConvertTo-Json -Compress
